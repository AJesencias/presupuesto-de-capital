px;border:1px solid var(--line);border-radius:12px;font-size:14px}table{border-collapse:collapse;width:100%;font-size:13px;background:var(--card);border-radius:12px;overflow:hidden}td,th{padding:10px 13px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}th{background:#eadbd0}.total td{font-weight:bold;border-top:2px solid var(--rose)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.metric{background:#eee4da;border-radius:12px;padding:13px}.metric strong{display:block;font:24px Georgia;color:var(--rose)}.metric small{font-size:10px;color:var(--muted)}.chart{display:flex;gap:12px;height:140px;align-items:end;margin:10px 0}.baritem{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px}.bar{width:68%;max-width:68px;background:linear-gradient(#d7b3a3,#b77f72);border-radius:8px 8px 2px 2px;animation:rise .8s ease-out;transform-origin:bottom}.baritem b{font-size:11px}.baritem small{font-size:10px;color:var(--muted)}@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}button{border:0;border-radius:30px;background:var(--ink);color:white;padding:9px 14px;cursor:pointer;font-size:12px}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.nav{display:flex;align-items:center;gap:8px}.counter{font-size:11px;color:var(--muted)}@media(max-width:800px){.slide{padding:25px 20px;min-height:90vh}.cover,.cols,.cols.two,.compare{grid-template-columns:1fr}.footer{gap:12px;align-items:flex-start;flex-direction:column}}@media print{body{background:white}.shell{padding:0;display:block}.slide{width:100%;min-height:100vh;border-radius:0;box-shadow:none;page-break-after:always}}

`<div><div class="eyebrow">4.1 · Aspectos generales</div><h2>¿Qué es el presupuesto de capital?</h2><p>Proceso de identificar, analizar y seleccionar inversiones de largo plazo que requieren desembolsos importantes y buscan generar beneficios futuros.</p><div class="visual-row"><div class="cols"><div class="tile"><div class="big">01</div><h3>Planificación</h3><p>Identificar proyectos y recursos necesarios.</p></div><div class="tile"><div class="big">02</div><h3>Análisis</h3><p>Estudiar costos, riesgos y flujos futuros.</p></div><div class="tile"><div class="big">03</div><h3>Decisión</h3><p>Elegir proyectos alineados con la estrategia.</p></div></div><div class="visual-card"><svg class="illustration" viewBox="0 0 320 230" role="img" aria-label="Gráfico de crecimiento de inversión">

`<div><div class="eyebrow">4.6 · Responsabilidades</div><h2>¿Quién participa?</h2><div class="cols two"><div class="tile"><h3>Gerencia / Junta</h3><p>Define prioridades y aprueba proyectos.</p></div><div class="tile"><h3>Gerencia financiera</h3><p>Analiza viabilidad, VAN, TIR y financiación.</p></div><div class="tile"><h3>Contabilidad</h3><p>Registra desembolsos y controla presupuesto.</p></div><div class="tile"><h3>Áreas operativas</h3><p>Identifican necesidades y beneficios esperados.</p></div></div></div>`,

`<div><div class="eyebrow">Alternativa A · Presupuesto</div><h2>Inversión inicial: RD$350,000</h2><table><thead><tr><th>Concepto</th><th>Monto</th></tr></thead><tbody><tr><td>Mesas y sillas de manicura</td><td>RD$65,000</td></tr><tr><td>Sillones y equipos de pedicura</td><td>RD$75,000</td></tr><tr><td>Lámparas UV/LED y equipos</td><td>RD$35,000</td></tr><tr><td>Bioseguridad y esterilización</td><td>RD$25,000</td></tr><tr><td>Remodelación y decoración</td><td>RD$70,000</td></tr><tr><td>Productos e insumos iniciales</td><td>RD$40,000</td></tr><tr><td>Publicidad y promoción</td><td>RD$15,000</td></tr><tr><td>Imprevistos e instalación</td><td>RD$25,000</td></tr><tr class="total"><td>Total</td><td>RD$350,000</td></tr></tbody></table><p>Vida útil: 5 años · Tasa de descuento asumida: 12% anual.</p></div>`,

`<div><div class="eyebrow">Justificación de la decisión</div><h2>Se recomienda la Alternativa A</h2><div class="cols"><div class="tile"><div class="big">+VAN</div><h3>Valor creado</h3><p>VAN positivo con los supuestos y tasa de descuento usados.</p></div><div class="tile"><div class="big">↓</div><h3>Menor capital</h3><p>RD$150,000 menos que la alternativa B.</p></div><div class="tile"><div class="big">21.08%</div><h3>Rentabilidad</h3><p>TIR estimada por encima de la tasa del 12%.</p></div></div><p>A se recomienda si el salón prioriza limitar el desembolso inicial: exige RD$150,000 menos, tiene una TIR superior y recupera ligeramente antes. Si el objetivo principal es maximizar el VAN y existe capacidad financiera, B sería la alternativa preferible. La decisión debe considerar también el riesgo y la disponibilidad de capital.</p></div>`,
`<div><div class="eyebrow">Conclusión</div><h2>Invertir con criterio financiero</h2><p>El presupuesto de capital permite valorar oportunidades de crecimiento con base en costos, beneficios esperados y riesgos. En este caso, ambas alternativas presentan VAN positivo y TIR superior al 12%. A requiere menos capital y tiene una TIR algo mayor; B genera un VAN más alto en términos absolutos.</p><div class="dark"><h3 style="font-size:25px">La decisión no consiste solo en invertir, sino en elegir la alternativa que genere valor y pueda sostenerse.</h3><p>Grupo 3 · Tema IV · Presupuesto de capital, parte I</p></div><p style="font-size:11px">Cifras estimadas para fines académicos, no cotizaciones reales. Flujos al final de cada año; VAN y TIR aproximados.</p></div>`
